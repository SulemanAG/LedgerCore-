<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Client Layer -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Security Layer -->
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Service Layer -->
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Database Layer -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 28px; font-weight: 800; fill: #f1f5f9; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
      .header { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #fff; }
      .text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code { font-family: 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #fff; }
      
      .flow-arrow { animation: flowArrow 1.5s ease-in-out infinite; }
      @keyframes flowArrow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#475569" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="850"/>
    <line x1="600" y1="0" x2="600" y2="850"/>
    <line x1="900" y1="0" x2="900" y2="850"/>
  </g>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <text class="title">🏦 LedgerCore — Architecture Overview</text>
    <text class="subtitle" y="28">High-Throughput Financial Event Processing Pipeline • Double-Entry Accounting Engine</text>
    <rect x="0" y="42" width="500" height="3" rx="1.5" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- ========== FLOW LINES ========== -->
  <!-- Client → Security -->
  <path d="M 230 280 L 380 280" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M 230 280 L 380 280" stroke="#38bdf8" stroke-width="2" fill="none" class="pulse">
    <animate attributeName="stroke-dashoffset" from="0" to="150" dur="2s" repeatCount="indefinite"/>
  </path>
  <polygon points="375,275 385,280 375,285" fill="#38bdf8" class="flow-arrow"/>

  <!-- Security → Service -->
  <path d="M 500 280 L 650 280" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M 500 280 L 650 280" stroke="#c084fc" stroke-width="2" fill="none" class="pulse">
    <animate attributeName="stroke-dashoffset" from="0" to="150" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  <polygon points="645,275 655,280 645,285" fill="#c084fc" class="flow-arrow"/>

  <!-- Service → Database -->
  <path d="M 770 280 L 920 280" stroke="#334155" stroke-width="4" fill="none"/>
  <path d="M 770 280 L 920 280" stroke="#f59e0b" stroke-width="2" fill="none" class="pulse">
    <animate attributeName="stroke-dashoffset" from="0" to="150" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  <polygon points="915,275 925,280 915,285" fill="#f59e0b" class="flow-arrow"/>

  <!-- Return Flow -->
  <path d="M 925 380 L 230 380" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <path d="M 925 380 L 230 380" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="8 6" class="pulse">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="3s" repeatCount="indefinite"/>
  </path>
  <polygon points="235,375 225,380 235,385" fill="#34d399" class="flow-arrow"/>

  <!-- ========== NODE 1: CLIENT ========== -->
  <g transform="translate(60, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="160" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="160" rx="16" fill="url(#clientGrad)" opacity="0.08"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="170" height="44" rx="16" fill="url(#clientGrad)"/>
    <rect x="0" y="20" width="170" height="24" fill="url(#clientGrad)"/>
    
    <text class="header" x="85" y="28" text-anchor="middle">📱 Client App</text>
    
    <circle cx="16" cy="22" r="4" fill="#4ade80" class="pulse"/>
    <circle cx="30" cy="22" r="4" fill="#4ade80" class="pulse" style="animation-delay: 0.3s"/>
    <circle cx="44" cy="22" r="4" fill="#4ade80" class="pulse" style="animation-delay: 0.6s"/>

    <text class="code" x="85" y="72" text-anchor="middle" fill="#38bdf8">POST /api/v1/pay</text>
    <text class="text" x="85" y="94" text-anchor="middle">Idempotency Key</text>
    <text class="text" x="85" y="112" text-anchor="middle">TLS 1.3 Signed</text>
    
    <rect x="25" y="126" width="120" height="20" rx="10" fill="#0369a1"/>
    <text class="badge" x="85" y="140" text-anchor="middle">🔒 TLS 1.3</text>
  </g>

  <!-- ========== NODE 2: SECURITY GATEWAY ========== -->
  <g transform="translate(390, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="160" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="160" rx="16" fill="url(#securityGrad)" opacity="0.08"/>
    
    <rect x="0" y="0" width="170" height="44" rx="16" fill="url(#securityGrad)"/>
    <rect x="0" y="20" width="170" height="24" fill="url(#securityGrad)"/>
    
    <text class="header" x="85" y="28" text-anchor="middle">🛡️ Security</text>

    <text class="code" x="85" y="72" text-anchor="middle" fill="#c084fc">AuthN + AuthZ</text>
    <text class="text" x="85" y="94" text-anchor="middle">BCrypt Verify</text>
    <text class="text" x="85" y="112" text-anchor="middle">Ownership Guard</text>
    
    <rect x="25" y="126" width="120" height="20" rx="10" fill="#7e22ce"/>
    <text class="badge" x="85" y="140" text-anchor="middle">⚡ Zero-Trust</text>
  </g>

  <!-- ========== NODE 3: SERVICE LAYER ========== -->
  <g transform="translate(660, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="160" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="160" rx="16" fill="url(#serviceGrad)" opacity="0.08"/>
    
    <rect x="0" y="0" width="170" height="44" rx="16" fill="url(#serviceGrad)"/>
    <rect x="0" y="20" width="170" height="24" fill="url(#serviceGrad)"/>
    
    <text class="header" x="85" y="28" text-anchor="middle">⚙️ Service</text>

    <text class="code" x="85" y="72" text-anchor="middle" fill="#fcd34d">@Transactional</text>
    <text class="text" x="85" y="94" text-anchor="middle">Debit + Credit</text>
    <text class="text" x="85" y="112" text-anchor="middle">Balance Invariant</text>
    
    <rect x="25" y="126" width="120" height="20" rx="10" fill="#b45309"/>
    <text class="badge" x="85" y="140" text-anchor="middle">🔄 ATOMIC</text>
  </g>

  <!-- ========== NODE 4: DATABASE ========== -->
  <g transform="translate(930, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="160" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="160" rx="16" fill="url(#dbGrad)" opacity="0.08"/>
    
    <rect x="0" y="0" width="170" height="44" rx="16" fill="url(#dbGrad)"/>
    <rect x="0" y="20" width="170" height="24" fill="url(#dbGrad)"/>
    
    <text class="header" x="85" y="28" text-anchor="middle">🐘 PostgreSQL</text>

    <text class="code" x="85" y="72" text-anchor="middle" fill="#34d399">ACID Ledger</text>
    <text class="text" x="85" y="94" text-anchor="middle">@Version Lock</text>
    <text class="text" x="85" y="112" text-anchor="middle">WAL + Immutable</text>
    
    <rect x="25" y="126" width="120" height="20" rx="10" fill="#047857"/>
    <text class="badge" x="85" y="140" text-anchor="middle">💾 PERSISTED</text>
  </g>

  <!-- ========== FLOW LABELS ========== -->
  <text class="text" x="305" y="270" text-anchor="middle" fill="#38bdf8" font-size="10">TLS 1.3</text>
  <text class="text" x="575" y="270" text-anchor="middle" fill="#c084fc" font-size="10">Validated DTO</text>
  <text class="text" x="845" y="270" text-anchor="middle" fill="#f59e0b" font-size="10">Atomic TX</text>
  <text class="text" x="580" y="400" text-anchor="middle" fill="#34d399" font-size="10">200 OK • Sanitized Response</text>

  <!-- ========== PHILOSOPHY BADGES ========== -->
  <g transform="translate(60, 420)">
    <text class="subtitle" y="0" fill="#94a3b8" font-size="16" font-weight="600">Core Philosophy — Non-Negotiable Rules</text>
    
    <!-- Badge 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="260" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text class="text" x="130" y="18" text-anchor="middle" fill="#38bdf8" font-weight="700">🔑 Keycard ≠ Person</text>
      <text class="text" x="130" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">User ↔ Customer decoupled</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(280, 20)">
      <rect x="0" y="0" width="260" height="44" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text class="text" x="130" y="18" text-anchor="middle" fill="#c084fc" font-weight="700">🚫 Never Trust Client</text>
      <text class="text" x="130" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">Server validates all input</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="260" height="44" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text class="text" x="130" y="18" text-anchor="middle" fill="#fcd34d" font-weight="700">🔒 ID Guessing Impossible</text>
      <text class="text" x="130" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">Ownership Guard enforces</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(280, 80)">
      <rect x="0" y="0" width="260" height="44" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text class="text" x="130" y="18" text-anchor="middle" fill="#6ee7b7" font-weight="700">⚖️ Money Can't Spawn</text>
      <text class="text" x="130" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">Debit = Credit invariant</text>
    </g>
  </g>

  <!-- ========== DETAILED FLOW SEQUENCE ========== -->
  <g transform="translate(60, 580)">
    <text class="subtitle" y="0" fill="#94a3b8" font-size="16" font-weight="600">Request Flow Sequence</text>

    <!-- Step 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="26" r="14" fill="#38bdf8" opacity="0.2"/>
      <text x="20" y="31" text-anchor="middle" fill="#38bdf8" font-weight="700" font-size="12">1</text>
      <text class="text" x="44" y="20" fill="#e2e8f0" font-weight="600">Client → Security</text>
      <text class="text" x="44" y="38" fill="#94a3b8" font-size="10">POST /accounts/{id}/transfer (Credentials + Payload)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(360, 20)">
      <rect x="0" y="0" width="340" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="26" r="14" fill="#c084fc" opacity="0.2"/>
      <text x="20" y="31" text-anchor="middle" fill="#c084fc" font-weight="700" font-size="12">2</text>
      <text class="text" x="44" y="20" fill="#e2e8f0" font-weight="600">Security → Service</text>
      <text class="text" x="44" y="38" fill="#94a3b8" font-size="10">BCrypt Verify → Ownership Guard → Validated DTO</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(740, 20)">
      <rect x="0" y="0" width="340" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="26" r="14" fill="#f59e0b" opacity="0.2"/>
      <text x="20" y="31" text-anchor="middle" fill="#fcd34d" font-weight="700" font-size="12">3</text>
      <text class="text" x="44" y="20" fill="#e2e8f0" font-weight="600">Service → Database</text>
      <text class="text" x="44" y="38" fill="#94a3b8" font-size="10">@Transactional • @Version Lock • Commit</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="340" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="26" r="14" fill="#34d399" opacity="0.2"/>
      <text x="20" y="31" text-anchor="middle" fill="#34d399" font-weight="700" font-size="12">4</text>
      <text class="text" x="44" y="20" fill="#e2e8f0" font-weight="600">Database → Client</text>
      <text class="text" x="44" y="38" fill="#94a3b8" font-size="10">200 OK • Sanitized AccountResponse DTO</text>
    </g>
  </g>

  <!-- ========== TECH STACK FOOTER ========== -->
  <g transform="translate(60, 780)">
    <rect x="0" y="0" width="1080" height="40" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <rect x="20" y="8" width="90" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="65" y="24" text-anchor="middle" fill="#f97316">☕ Java 17</text>
    
    <rect x="120" y="8" width="100" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="170" y="24" text-anchor="middle" fill="#6DB33F">🍃 Spring Boot 3</text>
    
    <rect x="230" y="8" width="90" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="275" y="24" text-anchor="middle" fill="#4169E1">🐘 PostgreSQL</text>
    
    <rect x="330" y="8" width="100" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="380" y="24" text-anchor="middle" fill="#6DB33F">🔐 Spring Security 6</text>

    <rect x="440" y="8" width="70" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="475" y="24" text-anchor="middle" fill="#8B5CF6">JPA</text>
    
    <rect x="520" y="8" width="80" height="24" rx="6" fill="#1e293b"/>
    <text class="badge" x="560" y="24" text-anchor="middle" fill="#34d399">Lombok</text>
    
    <text class="text" x="920" y="24" text-anchor="end" fill="#475569" font-size="11">MIT License • v1.0.0</text>
    <text class="text" x="1040" y="24" text-anchor="end" fill="#475569" font-size="11">📅 2025</text>
  </g>
</svg>
