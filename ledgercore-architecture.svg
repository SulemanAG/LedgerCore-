<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.35; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10px; filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.04)); }
      .card-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 10px; }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 10px; }
      .card-purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.5; rx: 10px; }
      .card-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; rx: 10px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2.5s linear infinite; }
      .flow-blue { stroke: #0284c7; }
      .flow-amber { stroke: #d97706; }
      .flow-purple { stroke: #9333ea; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <rect class="bg" width="1100" height="540" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <text class="title-main" x="0" y="20">LedgerCore — Financial Transaction &amp; Outbox Architecture</text>
    <text class="title-sub" x="0" y="40">Synchronous API Request Handling, Double-Entry Accounting, and Outbox Event Commitment</text>
  </g>

  <!-- HIGH LEVEL STACKED STAGES -->
  <g transform="translate(40, 90)">
    <!-- Stage 1: API & Security -->
    <g transform="translate(0, 0)">
      <rect class="card-blue" width="230" height="340" />
      <circle cx="28" cy="28" r="14" fill="#0284c7" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="50" y="33" class="card-title" fill="#0369a1">API &amp; Security Layer</text>
      <line x1="20" y1="52" x2="210" y2="52" stroke="#bae6fd" />
      <text x="20" y="75" class="code-text" fill="#0c4a6e">POST /accounts/transfer</text>
      <text x="20" y="100" class="body-text" fill="#0369a1">1. Spring Security 6 Auth</text>
      <text x="20" y="120" class="body-text" fill="#0369a1">   (BCrypt credentials check)</text>
      <text x="20" y="145" class="body-text" fill="#0369a1">2. Ownership Authorization</text>
      <text x="20" y="165" class="body-text" fill="#0369a1">   (AccountAuthService)</text>
      <text x="20" y="190" class="body-text" fill="#0369a1">3. Jakarta Bean Validation</text>
      <text x="20" y="210" class="body-text" fill="#0369a1">   (@Valid DTO constraints)</text>
      <text x="20" y="245" class="code-text" fill="#0284c7">Idempotency Lock Check</text>
      <text x="20" y="270" class="body-text" fill="#0c4a6e">Advisory lock prevents</text>
      <text x="20" y="290" class="body-text" fill="#0c4a6e">duplicate financial retry</text>
    </g>

    <!-- Flow Arrow 1 -> 2 -->
    <path class="flow-line flow-blue" d="M 235,170 L 265,170" marker-end="url(#arrow-blue)" />

    <!-- Stage 2: PostgreSQL Atomic ACID Transaction -->
    <g transform="translate(270, 0)">
      <rect class="card-amber" width="480" height="340" />
      <circle cx="28" cy="28" r="14" fill="#d97706" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="50" y="33" class="card-title" fill="#b45309">PostgreSQL @Transactional Boundary</text>
      <line x1="20" y1="52" x2="460" y2="52" stroke="#fde68a" />
      
      <!-- Subcard: Double-Entry Ledger -->
      <g transform="translate(20, 65)">
        <rect x="0" y="0" width="440" height="120" fill="#ffffff" stroke="#fde68a" rx="8" />
        <text x="15" y="22" class="code-text" fill="#78350f" font-weight="700">Atomic Financial Mutations (@Version Optimistic Lock)</text>
        <text x="15" y="44" class="body-text" fill="#78350f">• Source Account: Balance Debit + Version Bump</text>
        <text x="15" y="64" class="body-text" fill="#78350f">• Destination Account: Balance Credit + Version Bump</text>
        <text x="15" y="84" class="body-text" fill="#78350f">• Ledger Journal: DEBIT &amp; CREDIT entries (Sum Debits = Sum Credits)</text>
        <text x="15" y="104" class="body-text" fill="#78350f">• Transaction Record: State set to COMPLETED</text>
      </g>

      <!-- Subcard: Transactional Outbox Insert -->
      <g transform="translate(20, 195)">
        <rect x="0" y="0" width="440" height="125" fill="#ffffff" stroke="#fde68a" rx="8" />
        <text x="15" y="22" class="code-text" fill="#b45309" font-weight="700">Atomic Outbox Event Creation (state = 'PENDING')</text>
        <text x="15" y="44" class="body-text" fill="#78350f">• Financial state &amp; outbox event persist in SAME database transaction</text>
        <text x="15" y="64" class="body-text" fill="#78350f">• Optimistic lock failure or error triggers total transaction rollback</text>
        <text x="15" y="84" class="body-text" fill="#78350f">• Outbox insert rolls back automatically → Zero orphan events!</text>
        <text x="15" y="108" class="code-text" fill="#d97706">ACID Commitment Completed → HTTP 200 Response</text>
      </g>
    </g>

    <!-- Flow Arrow 2 -> 3 -->
    <path class="flow-line flow-amber" d="M 755,170 L 785,170" marker-end="url(#arrow-amber)" />

    <!-- Stage 3: Outbox Relay & Kafka Producer -->
    <g transform="translate(790, 0)">
      <rect class="card-purple" width="230" height="340" />
      <circle cx="28" cy="28" r="14" fill="#9333ea" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="50" y="33" class="card-title" fill="#6b21a8">Outbox Relay Engine</text>
      <line x1="20" y1="52" x2="210" y2="52" stroke="#e9d5ff" />
      <text x="20" y="75" class="code-text" fill="#581c87">OutboxRelayService</text>
      <text x="20" y="95" class="body-text" fill="#581c87">1. Polling Task (@Scheduled)</text>
      <text x="20" y="115" class="code-text" fill="#9333ea">FOR UPDATE SKIP LOCKED</text>
      <text x="20" y="140" class="body-text" fill="#581c87">2. Atomic row locking</text>
      <text x="20" y="160" class="body-text" fill="#581c87">   (State → PROCESSING)</text>
      <text x="20" y="185" class="body-text" fill="#581c87">3. KafkaProducerService</text>
      <text x="20" y="205" class="body-text" fill="#581c87">   (acks = all, retries = 3)</text>
      <text x="20" y="235" class="code-text" fill="#9333ea">State → PUBLISHED</text>
      <text x="20" y="260" class="body-text" fill="#6b21a8">Reliable handoff to</text>
      <text x="20" y="280" class="body-text" fill="#6b21a8">Kafka topic partitions</text>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(40, 455)">
    <rect class="card-rose" width="1020" height="55" />
    <text x="20" y="24" class="card-title" fill="#9f1239">Failure &amp; Rollback Safety Invariant</text>
    <text x="20" y="42" class="body-text" fill="#881337">Authentication failure, authorization denial, constraint invalidation, or JPA optimistic locking conflict triggers immediate transaction rollback. Financial mutations and outbox records revert together, preventing orphan events or inconsistent database states.</text>
  </g>
</svg>
