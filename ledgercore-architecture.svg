<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#7e22ce"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#059669"/>
    </marker>
    <marker id="arrowReturn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#64748b"/>
    </marker>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-main { font: 800 32px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .title-sub { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .node-title { font: 800 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-code { font: 700 15px 'Courier New', monospace; fill: #0f172a; }
      .node-text { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .node-sm { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .label-text { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-security { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-service { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-database { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; rx: 18; filter: url(#shadow); }

      /* Forward Flow Lines - Slower */
      .flow-client { stroke: #3b82f6; stroke-width: 3.5; fill: none; stroke-dasharray: 12 10; animation: dashForward 4s linear infinite; marker-end: url(#arrowBlue); }
      .flow-security { stroke: #8b5cf6; stroke-width: 3.5; fill: none; stroke-dasharray: 12 10; animation: dashForward 4s linear infinite; marker-end: url(#arrowPurple); }
      .flow-service { stroke: #f59e0b; stroke-width: 3.5; fill: none; stroke-dasharray: 12 10; animation: dashForward 4s linear infinite; marker-end: url(#arrowGold); }
      
      /* Return Flow Lines - Slower */
      .flow-return { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: dashReturn 4s linear infinite; marker-end: url(#arrowReturn); }
      .flow-return-green { stroke: #10b981; stroke-width: 3; fill: none; stroke-dasharray: 10 8; animation: dashReturn 4s linear infinite; marker-end: url(#arrowGreen); }

      @keyframes dashForward { to { stroke-dashoffset: -22; } }
      @keyframes dashReturn { to { stroke-dashoffset: 18; } }

      /* Request Pulse - Slower, 14s cycle */
      .request-pulse {
        fill: #3b82f6;
        filter: url(#glowBlue);
        animation: trackRequest 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .request-pulse-2 {
        fill: #8b5cf6;
        filter: url(#shadow);
        animation: trackRequest2 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .request-pulse-3 {
        fill: #f59e0b;
        filter: url(#shadow);
        animation: trackRequest3 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes trackRequest {
        0%   { transform: translate(0px, 0px); opacity: 0; r: 5; }
        4%   { opacity: 1; r: 5; }
        30%  { transform: translate(260px, 0px); opacity: 1; r: 5; }
        60%  { transform: translate(610px, 0px); opacity: 1; r: 5; }
        85%  { transform: translate(880px, 0px); opacity: 1; r: 5; }
        90%  { transform: translate(880px, 0px); opacity: 0; r: 5; }
        100% { transform: translate(0px, 0px); opacity: 0; r: 5; }
      }

      @keyframes trackRequest2 {
        0%   { transform: translate(0px, 0px); opacity: 0; r: 5; }
        30%  { transform: translate(0px, 0px); opacity: 0; r: 5; }
        34%  { opacity: 1; r: 5; }
        60%  { transform: translate(350px, 0px); opacity: 1; r: 5; }
        85%  { transform: translate(620px, 0px); opacity: 1; r: 5; }
        90%  { transform: translate(620px, 0px); opacity: 0; r: 5; }
        100% { transform: translate(0px, 0px); opacity: 0; r: 5; }
      }

      @keyframes trackRequest3 {
        0%   { transform: translate(0px, 0px); opacity: 0; r: 5; }
        60%  { transform: translate(0px, 0px); opacity: 0; r: 5; }
        64%  { opacity: 1; r: 5; }
        85%  { transform: translate(270px, 0px); opacity: 1; r: 5; }
        90%  { transform: translate(270px, 0px); opacity: 0; r: 5; }
        100% { transform: translate(0px, 0px); opacity: 0; r: 5; }
      }

      /* Response Pulse - Slower, 14s cycle, delayed */
      .response-pulse {
        fill: #10b981;
        filter: url(#glowGreen);
        animation: trackResponse 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        animation-delay: 7s;
      }

      @keyframes trackResponse {
        0%   { transform: translate(0px, 0px); opacity: 0; r: 5; }
        4%   { opacity: 1; r: 5; }
        30%  { transform: translate(-270px, 0px); opacity: 1; r: 5; }
        60%  { transform: translate(-620px, 0px); opacity: 1; r: 5; }
        85%  { transform: translate(-880px, 160px); opacity: 1; r: 5; }
        90%  { transform: translate(-880px, 160px); opacity: 0; r: 5; }
        100% { transform: translate(0px, 0px); opacity: 0; r: 5; }
      }

      .dot { animation: pulseDot 2.5s ease-in-out infinite; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; r: 4; }
        50% { opacity: 1; r: 7; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="980" fill="#f8fafc"/>

  <!-- Title Header -->
  <text x="700" y="55" text-anchor="middle" class="title-main">🏦 LedgerCore — Request to Response Architecture Flow</text>
  <text x="700" y="88" text-anchor="middle" class="title-sub">Double-Entry Financial Ledger Engine • Spring Boot 3 • Java 17 • PostgreSQL</text>

  <!-- ===== FORWARD CONNECTION LINES ===== -->
  <!-- Client → Security -->
  <path d="M260 230L360 230" class="flow-client"/>
  <!-- Security → Service -->
  <path d="M630 230L730 230" class="flow-security"/>
  <!-- Service → Database -->
  <path d="M1000 230L1100 230" class="flow-service"/>

  <!-- ===== RETURN CONNECTION LINES ===== -->
  <!-- Database → Service -->
  <path d="M1100 285 L730 285" class="flow-return"/>
  <!-- Service → Security -->
  <path d="M730 285 L360 285" class="flow-return"/>
  <!-- Security → Client (curved) -->
  <path d="M360 285 C 310 285, 310 445, 260 445" class="flow-return-green"/>

  <!-- ===== REQUEST PULSE TRACKERS ===== -->
  <circle cx="260" cy="230" r="5" class="request-pulse"/>
  <circle cx="630" cy="230" r="5" class="request-pulse-2"/>
  <circle cx="1000" cy="230" r="5" class="request-pulse-3"/>

  <!-- ===== RESPONSE PULSE TRACKER ===== -->
  <circle cx="1100" cy="285" r="5" class="response-pulse"/>

  <!-- ===== NODE 1: CLIENT ===== -->
  <rect x="60" y="150" width="200" height="160" class="box-client"/>
  <circle cx="85" cy="175" r="6" class="dot" fill="#3b82f6"/>
  <circle cx="105" cy="175" r="6" class="dot" fill="#3b82f6" style="animation-delay: 0.5s"/>
  <circle cx="125" cy="175" r="6" class="dot" fill="#3b82f6" style="animation-delay: 1s"/>
  
  <text x="160" y="192" text-anchor="middle" class="node-title">📱 Client App</text>
  <text x="160" y="225" text-anchor="middle" class="node-code">POST /api/v1/pay</text>
  <text x="160" y="255" text-anchor="middle" class="node-text">Idempotency Key</text>
  <text x="160" y="282" text-anchor="middle" class="node-sm">TLS 1.3 Signed</text>

  <!-- ===== NODE 2: SECURITY GATEWAY ===== -->
  <rect x="360" y="140" width="270" height="180" class="box-security"/>
  <text x="495" y="178" text-anchor="middle" class="node-title">🛡️ Security Gateway</text>
  <text x="495" y="212" text-anchor="middle" class="node-code">Spring Security 6</text>
  <text x="495" y="242" text-anchor="middle" class="node-text">BCrypt Password Verify</text>
  <text x="495" y="268" text-anchor="middle" class="node-text">Ownership Guard (AuthZ)</text>
  <text x="495" y="296" text-anchor="middle" class="node-sm">Zero-Trust Architecture</text>

  <!-- ===== NODE 3: SERVICE LAYER ===== -->
  <rect x="730" y="140" width="270" height="180" class="box-service"/>
  <text x="865" y="178" text-anchor="middle" class="node-title">⚙️ Service Layer</text>
  <text x="865" y="212" text-anchor="middle" class="node-code">@Transactional</text>
  <text x="865" y="242" text-anchor="middle" class="node-text">Debit Source Account</text>
  <text x="865" y="268" text-anchor="middle" class="node-text">Credit Target Account</text>
  <text x="865" y="296" text-anchor="middle" class="node-sm">Balance Invariant Check</text>

  <!-- ===== NODE 4: DATABASE ===== -->
  <rect x="1100" y="140" width="240" height="180" class="box-database"/>
  <text x="1220" y="178" text-anchor="middle" class="node-title">🐘 PostgreSQL</text>
  <text x="1220" y="212" text-anchor="middle" class="node-code">ACID Ledger</text>
  <text x="1220" y="242" text-anchor="middle" class="node-text">@Version Optimistic Lock</text>
  <text x="1220" y="268" text-anchor="middle" class="node-text">WAL + Immutable History</text>
  <text x="1220" y="296" text-anchor="middle" class="node-sm">Persisted Records</text>

  <!-- ===== NODE 5: RESPONSE ===== -->
  <rect x="60" y="380" width="200" height="140" class="box-client"/>
  <text x="160" y="418" text-anchor="middle" class="node-title">✅ Response</text>
  <text x="160" y="452" text-anchor="middle" class="node-code">200 OK</text>
  <text x="160" y="482" text-anchor="middle" class="node-text">Sanitized DTO</text>
  <text x="160" y="508" text-anchor="middle" class="node-sm">JSON Response</text>

  <!-- ===== FLOW LABELS ===== -->
  <text x="310" y="215" text-anchor="middle" class="label-text" fill="#3b82f6">TLS 1.3</text>
  <text x="680" y="215" text-anchor="middle" class="label-text" fill="#8b5cf6">Validated DTO</text>
  <text x="1050" y="215" text-anchor="middle" class="label-text" fill="#f59e0b">Atomic TX</text>
  <text x="920" y="300" text-anchor="middle" class="label-text" fill="#64748b">Student object</text>
  <text x="310" y="390" text-anchor="middle" class="label-text" fill="#10b981">200 OK • Sanitized Response</text>

  <!-- ===== BOTTOM SECTION: CORE PHILOSOPHY ===== -->
  <rect x="100" y="580" width="1200" height="330" class="box" rx="22"/>
  <text x="700" y="628" text-anchor="middle" class="title-main" font-size="24">Core Philosophy — Four Non-Negotiable Rules</text>
  <text x="700" y="658" text-anchor="middle" class="title-sub">LedgerCore enforces real-world banking rules that prevent financial collapse</text>

  <!-- Rule 1 -->
  <rect x="140" y="690" width="250" height="100" class="box-client"/>
  <text x="265" y="730" text-anchor="middle" class="node-title" font-size="18">🔑 Keycard ≠ Person</text>
  <text x="265" y="760" text-anchor="middle" class="node-sm">User ↔ Customer decoupled</text>
  <text x="265" y="780" text-anchor="middle" class="node-sm">Login ≠ Banking Identity</text>

  <!-- Rule 2 -->
  <rect x="420" y="690" width="250" height="100" class="box-security"/>
  <text x="545" y="730" text-anchor="middle" class="node-title" font-size="18">🚫 Never Trust Client</text>
  <text x="545" y="760" text-anchor="middle" class="node-sm">Server validates all input</text>
  <text x="545" y="780" text-anchor="middle" class="node-sm">Client never tells balance</text>

  <!-- Rule 3 -->
  <rect x="700" y="690" width="250" height="100" class="box-service"/>
  <text x="825" y="730" text-anchor="middle" class="node-title" font-size="18">🔒 ID Guessing Impossible</text>
  <text x="825" y="760" text-anchor="middle" class="node-sm">Ownership Guard enforces</text>
  <text x="825" y="780" text-anchor="middle" class="node-sm">Account # ≠ Access</text>

  <!-- Rule 4 -->
  <rect x="980" y="690" width="250" height="100" class="box-database"/>
  <text x="1105" y="730" text-anchor="middle" class="node-title" font-size="18">⚖️ Money Can't Spawn</text>
  <text x="1105" y="760" text-anchor="middle" class="node-sm">Debit = Credit invariant</text>
  <text x="1105" y="780" text-anchor="middle" class="node-sm">Balanced transactions only</text>

  <!-- Bottom Footer -->
  <text x="700" y="850" text-anchor="middle" class="node-sm" fill="#94a3b8">Current project implements Account Management &amp; Security; Double-Entry Ledger Engine coming in Phase 2</text>
  <text x="700" y="878" text-anchor="middle" class="node-sm" fill="#94a3b8">Java 17 • Spring Boot 3 • Spring Security 6 • PostgreSQL • JPA • Lombok • MIT License</text>
  
  <!-- Tech Stack Badges -->
  <rect x="280" y="898" width="90" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="325" y="917" text-anchor="middle" class="node-sm" fill="#f97316" font-weight="700">☕ Java 17</text>
  
  <rect x="380" y="898" width="100" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="430" y="917" text-anchor="middle" class="node-sm" fill="#6DB33F" font-weight="700">🍃 Spring Boot 3</text>
  
  <rect x="490" y="898" width="90" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="535" y="917" text-anchor="middle" class="node-sm" fill="#4169E1" font-weight="700">🐘 PostgreSQL</text>
  
  <rect x="590" y="898" width="110" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="645" y="917" text-anchor="middle" class="node-sm" fill="#6DB33F" font-weight="700">🔐 Spring Security 6</text>
  
  <rect x="710" y="898" width="70" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="745" y="917" text-anchor="middle" class="node-sm" fill="#8B5CF6" font-weight="700">JPA</text>
  
  <rect x="790" y="898" width="80" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="830" y="917" text-anchor="middle" class="node-sm" fill="#34d399" font-weight="700">Lombok</text>
  
  <text x="1120" y="917" text-anchor="end" class="node-sm" fill="#94a3b8">MIT License • v1.0.0</text>
</svg>
