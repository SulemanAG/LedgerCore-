<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.04)); }
      .card-emerald { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 8px; }
      .card-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; rx: 8px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2s linear infinite; }
      .flow-emerald { stroke: #16a34a; }
      .flow-rose { stroke: #e11d48; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="320" />

  <!-- HEADER -->
  <g transform="translate(30, 20)">
    <text class="title-main" x="0" y="16">5. Consumer Event Processing &amp; Durable Idempotency</text>
    <text class="title-sub" x="0" y="32">Kafka Consumer Poll → processed_events Table Lookup → Deduplication / State Save</text>
  </g>

  <!-- FLOW STEPS -->
  <g transform="translate(30, 70)">
    <!-- Step 1: Kafka Listener -->
    <g transform="translate(0, 0)">
      <rect class="card-emerald" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#16a34a" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="44" y="28" class="card-title" fill="#15803d">Kafka Listener</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#bbf7d0" />
      <text x="15" y="65" class="code-text" fill="#14532d">KafkaConsumerService</text>
      <text x="15" y="85" class="body-text" fill="#14532d">• Polls transactions topic</text>
      <text x="15" y="105" class="body-text" fill="#14532d">• Deserializes event</text>
      <text x="15" y="125" class="code-text" fill="#16a34a">At-Least-Once Delivery</text>
      <text x="15" y="155" class="body-text" fill="#15803d">Delegates payload to</text>
      <text x="15" y="175" class="body-text" fill="#15803d">EventProcessingService</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path class="flow-line flow-emerald" d="M 195,100 L 225,100" marker-end="url(#arrow-emerald)" />

    <!-- Step 2: processed_events Table -->
    <g transform="translate(230, 0)">
      <rect class="card" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#475569" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="44" y="28" class="card-title">processed_events</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#e2e8f0" />
      <text x="15" y="65" class="code-text" fill="#0f172a">PostgreSQL Store</text>
      <text x="15" y="85" class="code-text" fill="#64748b">existsById(eventId)</text>
      <text x="15" y="115" class="body-text" fill="#475569">• Unique event_id check</text>
      <text x="15" y="135" class="body-text" fill="#475569">• Prevents re-execution</text>
      <text x="15" y="165" class="code-text" fill="#0f172a">Durable Protection</text>
      <text x="15" y="180" class="body-text" fill="#64748b">across restarts</text>
    </g>

    <!-- Arrow 2 -> 3 (Branching YES / NO) -->
    <path class="flow-line flow-rose" d="M 435,70 L 465,70" marker-end="url(#arrow-rose)" />
    <path class="flow-line flow-emerald" d="M 435,130 L 465,130" marker-end="url(#arrow-emerald)" />

    <!-- Step 3: Duplicate Redelivery (YES) -->
    <g transform="translate(470, 0)">
      <rect class="card-rose" width="200" height="95" />
      <circle cx="20" cy="20" r="10" fill="#e11d48" />
      <text x="20" y="24" font-size="10px" font-weight="700" fill="#ffffff" text-anchor="middle">3A</text>
      <text x="36" y="24" class="card-title" fill="#9f1239">Duplicate Event (YES)</text>
      <line x1="10" y1="36" x2="190" y2="36" stroke="#fecdd3" />
      <text x="10" y="54" class="code-text" fill="#be123c">ID Already Exists!</text>
      <text x="10" y="74" class="body-text" fill="#881337">Log &amp; Skip (Zero Balance Impact)</text>

      <!-- Step 3B: Valid New Event (NO) -->
      <g transform="translate(0, 105)">
        <rect class="card-emerald" width="200" height="95" />
        <circle cx="20" cy="20" r="10" fill="#16a34a" />
        <text x="20" y="24" font-size="10px" font-weight="700" fill="#ffffff" text-anchor="middle">3B</text>
        <text x="36" y="24" class="card-title" fill="#15803d">New Event (NO)</text>
        <line x1="10" y1="36" x2="190" y2="36" stroke="#bbf7d0" />
        <text x="10" y="54" class="code-text" fill="#14532d">Update Redis Read Projection</text>
        <text x="10" y="74" class="body-text" fill="#166534">Insert event_id into PostgreSQL</text>
      </g>
    </g>

    <!-- Arrow 3B -> 4 -->
    <path class="flow-line flow-emerald" d="M 675,152 L 705,152" marker-end="url(#arrow-emerald)" />

    <!-- Step 4: Projection State Complete -->
    <g transform="translate(710, 0)">
      <rect class="card" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#475569" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="44" y="28" class="card-title">State Completed</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#e2e8f0" />
      <text x="15" y="65" class="code-text" fill="#0f172a">Atomic Execution</text>
      <text x="15" y="85" class="body-text" fill="#475569">• Redis balance set</text>
      <text x="15" y="105" class="body-text" fill="#475569">• Redis version set</text>
      <text x="15" y="125" class="body-text" fill="#475569">• ProcessedEvent saved</text>
      <text x="15" y="155" class="code-text" fill="#16a34a">Idempotency Complete</text>
      <text x="15" y="175" class="body-text" fill="#334155">Exactly-once effect</text>
    </g>
  </g>
</svg>
