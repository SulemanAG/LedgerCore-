<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.04)); }
      .card-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 8px; }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 8px; }
      .card-emerald { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 8px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2s linear infinite; }
      .flow-blue { stroke: #0284c7; }
      .flow-amber { stroke: #d97706; }
      .flow-emerald { stroke: #16a34a; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="320" />

  <!-- HEADER -->
  <g transform="translate(30, 20)">
    <text class="title-main" x="0" y="16">1. Synchronous Financial Transaction &amp; Double-Entry Ledger</text>
    <text class="title-sub" x="0" y="32">HTTP Client Request → Security &amp; Ownership Check → Atomic Double-Entry Commit</text>
  </g>

  <!-- FLOW STEPS -->
  <g transform="translate(30, 70)">
    <!-- Step 1: Client Request -->
    <g transform="translate(0, 0)">
      <rect class="card-blue" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#0284c7" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="44" y="28" class="card-title" fill="#0369a1">Client Request</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#bae6fd" />
      <text x="15" y="65" class="code-text" fill="#0c4a6e">POST /transfer</text>
      <text x="15" y="85" class="body-text" fill="#0369a1">• Basic Auth Credentials</text>
      <text x="15" y="105" class="body-text" fill="#0369a1">• Idempotency Key</text>
      <text x="15" y="125" class="body-text" fill="#0369a1">• Source &amp; Target IDs</text>
      <text x="15" y="145" class="body-text" fill="#0369a1">• Transfer Amount</text>
      <text x="15" y="175" class="code-text" fill="#0284c7">@Valid Request DTO</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path class="flow-line flow-blue" d="M 195,100 L 225,100" marker-end="url(#arrow-blue)" />

    <!-- Step 2: Auth & Ownership Guard -->
    <g transform="translate(230, 0)">
      <rect class="card" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#475569" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="44" y="28" class="card-title">Security &amp; Auth Guard</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#e2e8f0" />
      <text x="15" y="65" class="code-text" fill="#475569">Spring Security 6</text>
      <text x="15" y="85" class="body-text">• BCrypt Hash Check</text>
      <text x="15" y="105" class="body-text">• Ownership Verification</text>
      <text x="15" y="125" class="code-text" fill="#0f172a">AccountAuthService</text>
      <text x="15" y="155" class="body-text" fill="#64748b">Ensures Principal owns</text>
      <text x="15" y="175" class="body-text" fill="#64748b">Source Account ID</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path class="flow-line flow-amber" d="M 435,100 L 465,100" marker-end="url(#arrow-amber)" />

    <!-- Step 3: Service Layer & Rules -->
    <g transform="translate(470, 0)">
      <rect class="card-amber" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#d97706" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="44" y="28" class="card-title" fill="#b45309">Service &amp; Rules</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#fde68a" />
      <text x="15" y="65" class="code-text" fill="#78350f">TransferServiceImpl</text>
      <text x="15" y="85" class="body-text" fill="#78350f">• Advisory Lock Check</text>
      <text x="15" y="105" class="body-text" fill="#78350f">• Balance Check (Sufficient?)</text>
      <text x="15" y="125" class="body-text" fill="#78350f">• Debits = Credits Rule</text>
      <text x="15" y="155" class="code-text" fill="#d97706">@Transactional</text>
      <text x="15" y="175" class="body-text" fill="#b45309">ACID Isolation Boundary</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path class="flow-line flow-emerald" d="M 675,100 L 705,100" marker-end="url(#arrow-emerald)" />

    <!-- Step 4: PostgreSQL Commit -->
    <g transform="translate(710, 0)">
      <rect class="card-emerald" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#16a34a" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="44" y="28" class="card-title" fill="#15803d">PostgreSQL Commit</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#bbf7d0" />
      <text x="15" y="65" class="code-text" fill="#14532d">Atomic Mutations:</text>
      <text x="15" y="85" class="body-text" fill="#14532d">1. Source Debit</text>
      <text x="15" y="105" class="body-text" fill="#14532d">2. Target Credit</text>
      <text x="15" y="125" class="body-text" fill="#14532d">3. Ledger Entries</text>
      <text x="15" y="145" class="body-text" fill="#14532d">4. Transaction Record</text>
      <text x="15" y="175" class="code-text" fill="#16a34a">HTTP 200 OK Response</text>
    </g>
  </g>
</svg>
