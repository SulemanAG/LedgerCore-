<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.35; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10px; filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.04)); }
      .card-purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.5; rx: 10px; }
      .card-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 10px; }
      .card-emerald { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 10px; }
      .card-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; rx: 10px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2.5s linear infinite; }
      .flow-purple { stroke: #9333ea; }
      .flow-emerald { stroke: #16a34a; }
      .flow-rose { stroke: #e11d48; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect class="bg" width="1100" height="540" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <text class="title-main" x="0" y="20">LedgerCore — Kafka Streaming, Ordering &amp; DLT Architecture</text>
    <text class="title-sub" x="0" y="40">Multi-Partition Keyed Streaming, Consumer Idempotency, and Bounded Dead-Letter Recovery</text>
  </g>

  <!-- STAGES -->
  <g transform="translate(40, 90)">
    <!-- Stage 1: Topic Partition Ordering -->
    <g transform="translate(0, 0)">
      <rect class="card-purple" width="310" height="340" />
      <circle cx="28" cy="28" r="14" fill="#9333ea" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="50" y="33" class="card-title" fill="#6b21a8">Keyed Partition Streaming</text>
      <line x1="20" y1="52" x2="290" y2="52" stroke="#e9d5ff" />
      
      <text x="20" y="75" class="code-text" fill="#581c87">KafkaEvent&lt;T&gt; Envelope</text>
      <text x="20" y="95" class="body-text" fill="#581c87">• eventId, eventType, aggregateId, occurredAt</text>
      
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="270" height="95" fill="#ffffff" stroke="#e9d5ff" rx="6" />
        <text x="12" y="20" class="code-text" fill="#9333ea" font-weight="700">Partition 0 (Acc 101 Stream)</text>
        <text x="12" y="40" class="body-text" fill="#581c87">#101 DEPOSIT → #102 TRANSFER_SOURCE</text>
        <text x="12" y="60" class="code-text" fill="#9333ea" font-weight="700">Partition 1 (Acc 202 Stream)</text>
        <text x="12" y="80" class="body-text" fill="#581c87">#881 TRANSFER_DEST → #882 DEPOSIT</text>
      </g>

      <text x="20" y="230" class="code-text" fill="#9333ea">Key = aggregateId (AccountId)</text>
      <text x="20" y="255" class="body-text" fill="#6b21a8">Guarantees strict sequential ordering per account partition without global topic lock!</text>
    </g>

    <!-- Flow Arrow 1 -> 2 -->
    <path class="flow-line flow-purple" d="M 315,170 L 345,170" marker-end="url(#arrow-purple)" />

    <!-- Stage 2: Consumer & Idempotency -->
    <g transform="translate(350, 0)">
      <rect class="card-emerald" width="360" height="340" />
      <circle cx="28" cy="28" r="14" fill="#16a34a" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="50" y="33" class="card-title" fill="#15803d">Consumer &amp; Idempotency</text>
      <line x1="20" y1="52" x2="340" y2="52" stroke="#bbf7d0" />

      <text x="20" y="75" class="code-text" fill="#14532d">KafkaConsumerService (@KafkaListener)</text>
      <text x="20" y="95" class="body-text" fill="#14532d">• Polls transactions topic asynchronously</text>

      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="320" height="120" fill="#ffffff" stroke="#bbf7d0" rx="6" />
        <text x="12" y="20" class="code-text" fill="#16a34a" font-weight="700">processed_events DB Lookup</text>
        <text x="12" y="42" class="body-text" fill="#9f1239">• Duplicate ID? Log warning &amp; skip processing</text>
        <text x="12" y="62" class="body-text" fill="#14532d">• New Event ID? Update Redis Read Projection</text>
        <text x="12" y="82" class="body-text" fill="#14532d">• Insert ProcessedEvent record in PostgreSQL</text>
        <text x="12" y="104" class="code-text" fill="#16a34a">Durable Exactly-Once Business Semantics</text>
      </g>

      <text x="20" y="255" class="code-text" fill="#16a34a">At-Least-Once Delivery Safe</text>
      <text x="20" y="275" class="body-text" fill="#15803d">Redelivered events cause zero double-credit effect</text>
    </g>

    <!-- Flow Arrow 2 -> 3 -->
    <path class="flow-line flow-emerald" d="M 715,170 L 745,170" marker-end="url(#arrow-emerald)" />

    <!-- Stage 3: Bounded Retry & DLT Recovery -->
    <g transform="translate(750, 0)">
      <rect class="card-rose" width="270" height="340" />
      <circle cx="28" cy="28" r="14" fill="#e11d48" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="50" y="33" class="card-title" fill="#9f1239">Retry Loop &amp; DLT</text>
      <line x1="20" y1="52" x2="250" y2="52" stroke="#fecdd3" />

      <text x="20" y="75" class="code-text" fill="#be123c">DefaultErrorHandler</text>
      <text x="20" y="95" class="body-text" fill="#881337">• 3 Total Attempts (1s backoff)</text>
      <text x="20" y="115" class="body-text" fill="#881337">• Retries transient errors</text>

      <g transform="translate(20, 135)">
        <rect x="0" y="0" width="230" height="95" fill="#ffffff" stroke="#fecdd3" rx="6" />
        <text x="10" y="20" class="code-text" fill="#e11d48" font-weight="700">DeadLetterPublishing...</text>
        <text x="10" y="40" class="body-text" fill="#881337">• Routes to DLT topic:</text>
        <text x="10" y="60" class="code-text" fill="#be123c">transactions.DLT</text>
        <text x="10" y="80" class="body-text" fill="#881337">• Preserves headers &amp; stack trace</text>
      </g>

      <text x="20" y="255" class="code-text" fill="#e11d48">Non-Blocking Isolation</text>
      <text x="20" y="275" class="body-text" fill="#9f1239">Poison pill messages never block healthy streams!</text>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(40, 455)">
    <rect class="card-purple" width="1020" height="55" />
    <text x="20" y="24" class="card-title" fill="#6b21a8">Kafka Subsystem Guarantees</text>
    <text x="20" y="42" class="body-text" fill="#581c87">Events are ordered by account ID, processed with DB-backed idempotency, and protected by a bounded 3-attempt retry loop with automated DLT forwarding to isolate invalid messages without pipeline downtime.</text>
  </g>
</svg>
