<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.04)); }
      .card-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5; rx: 8px; }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 8px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2s linear infinite; }
      .flow-rose { stroke: #e11d48; }
      .flow-amber { stroke: #d97706; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="320" />

  <!-- HEADER -->
  <g transform="translate(30, 20)">
    <text class="title-main" x="0" y="16">6. Bounded Consumer Retries &amp; Dead-Letter Topic (DLT) Fault Recovery</text>
    <text class="title-sub" x="0" y="32">Processing Error → DefaultErrorHandler Loop → DLT Forwarding &amp; Poison Pill Isolation</text>
  </g>

  <!-- FLOW STEPS -->
  <g transform="translate(30, 70)">
    <!-- Step 1: Processing Failure -->
    <g transform="translate(0, 0)">
      <rect class="card-rose" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#e11d48" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="44" y="28" class="card-title" fill="#9f1239">Processing Error</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#fecdd3" />
      <text x="15" y="65" class="code-text" fill="#be123c">Consumer Exception</text>
      <text x="15" y="85" class="body-text" fill="#881337">• Network Glitch</text>
      <text x="15" y="105" class="body-text" fill="#881337">• Serialization Error</text>
      <text x="15" y="125" class="body-text" fill="#881337">• Redis Timeout</text>
      <text x="15" y="155" class="code-text" fill="#e11d48">Triggers Retry</text>
      <text x="15" y="175" class="body-text" fill="#9f1239">Catches exception</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path class="flow-line flow-rose" d="M 195,100 L 225,100" marker-end="url(#arrow-rose)" />

    <!-- Step 2: DefaultErrorHandler Loop -->
    <g transform="translate(230, 0)">
      <rect class="card-amber" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#d97706" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="44" y="28" class="card-title" fill="#b45309">Retry Loop (3x)</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#fde68a" />
      <text x="15" y="65" class="code-text" fill="#78350f">DefaultErrorHandler</text>
      <text x="15" y="85" class="body-text" fill="#78350f">• Attempt 1: Fails</text>
      <text x="15" y="105" class="body-text" fill="#78350f">• Backoff: 1000ms</text>
      <text x="15" y="125" class="body-text" fill="#78350f">• Attempt 2: Fails</text>
      <text x="15" y="145" class="body-text" fill="#78350f">• Attempt 3: Fails</text>
      <text x="15" y="175" class="code-text" fill="#b45309">Retries Exhausted</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path class="flow-line flow-amber" d="M 435,100 L 465,100" marker-end="url(#arrow-amber)" />

    <!-- Step 3: DLT Recoverer -->
    <g transform="translate(470, 0)">
      <rect class="card-rose" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#e11d48" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="44" y="28" class="card-title" fill="#9f1239">DLT Recoverer</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#fecdd3" />
      <text x="15" y="65" class="code-text" fill="#be123c">DeadLetterPublishing</text>
      <text x="15" y="85" class="body-text" fill="#881337">• Intercepts failure</text>
      <text x="15" y="105" class="body-text" fill="#881337">• Attaches Headers:</text>
      <text x="15" y="125" class="code-text" fill="#9f1239">dlt-exception-msg</text>
      <text x="15" y="155" class="body-text" fill="#881337">Routes to Dead-Letter</text>
      <text x="15" y="175" class="body-text" fill="#881337">Topic automatically</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path class="flow-line flow-rose" d="M 675,100 L 705,100" marker-end="url(#arrow-rose)" />

    <!-- Step 4: DLT Topic Isolation -->
    <g transform="translate(710, 0)">
      <rect class="card" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#475569" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="44" y="28" class="card-title">DLT Isolation</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#e2e8f0" />
      <text x="15" y="65" class="code-text" fill="#0f172a">DLT Topic</text>
      <text x="15" y="85" class="code-text" fill="#e11d48">transactions.DLT</text>
      <text x="15" y="115" class="body-text" fill="#475569">• Bad event isolated</text>
      <text x="15" y="135" class="body-text" fill="#475569">• Consumer unblocked</text>
      <text x="15" y="165" class="code-text" fill="#16a34a">Pipeline Operating</text>
      <text x="15" y="180" class="body-text" fill="#334155">Zero blocking crash</text>
    </g>
  </g>
</svg>
