<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.04)); }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 8px; }
      .card-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 8px; }
      .card-purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.5; rx: 8px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2s linear infinite; }
      .flow-amber { stroke: #d97706; }
      .flow-blue { stroke: #0284c7; }
      .flow-purple { stroke: #9333ea; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="320" />

  <!-- HEADER -->
  <g transform="translate(30, 20)">
    <text class="title-main" x="0" y="16">2. Transactional Outbox Pattern &amp; Relay Engine</text>
    <text class="title-sub" x="0" y="32">Atomic Outbox Commitment → SKIP LOCKED Row Polling → Reliable Kafka Publishing</text>
  </g>

  <!-- FLOW STEPS -->
  <g transform="translate(30, 70)">
    <!-- Step 1: Atomic Outbox Insert -->
    <g transform="translate(0, 0)">
      <rect class="card-amber" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#d97706" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="44" y="28" class="card-title" fill="#b45309">Atomic DB Outbox</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#fde68a" />
      <text x="15" y="65" class="code-text" fill="#78350f">Same DB Transaction</text>
      <text x="15" y="85" class="body-text" fill="#78350f">• Financial Mutation</text>
      <text x="15" y="105" class="body-text" fill="#78350f">• Ledger Entry Insert</text>
      <text x="15" y="125" class="body-text" fill="#78350f">• OutboxEvent Insert</text>
      <text x="15" y="155" class="code-text" fill="#d97706">Status: PENDING</text>
      <text x="15" y="175" class="body-text" fill="#b45309">Zero Dual-Write Anomaly</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path class="flow-line flow-amber" d="M 195,100 L 225,100" marker-end="url(#arrow-amber)" />

    <!-- Step 2: outbox_events Table -->
    <g transform="translate(230, 0)">
      <rect class="card" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#475569" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="44" y="28" class="card-title">outbox_events Store</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#e2e8f0" />
      <text x="15" y="65" class="code-text" fill="#0f172a">PostgreSQL Table</text>
      <text x="15" y="85" class="code-text" fill="#64748b">event_id: "evt_991"</text>
      <text x="15" y="105" class="code-text" fill="#64748b">aggregate_id: "101"</text>
      <text x="15" y="125" class="code-text" fill="#64748b">payload: JSON</text>
      <text x="15" y="155" class="body-text" fill="#475569">Persisted durably in DB</text>
      <text x="15" y="175" class="body-text" fill="#475569">Survives system crash</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path class="flow-line flow-blue" d="M 435,100 L 465,100" marker-end="url(#arrow-blue)" />

    <!-- Step 3: OutboxRelayService -->
    <g transform="translate(470, 0)">
      <rect class="card-blue" width="200" height="200" />
      <circle cx="24" cy="24" r="12" fill="#0284c7" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="44" y="28" class="card-title" fill="#0369a1">OutboxRelayService</text>
      <line x1="15" y1="45" x2="185" y2="45" stroke="#bae6fd" />
      <text x="15" y="65" class="code-text" fill="#0c4a6e">@Scheduled Poller</text>
      <text x="15" y="85" class="code-text" fill="#0284c7" font-weight="700">FOR UPDATE SKIP LOCKED</text>
      <text x="15" y="115" class="body-text" fill="#0369a1">• Claims pending rows</text>
      <text x="15" y="135" class="body-text" fill="#0369a1">• State → PROCESSING</text>
      <text x="15" y="165" class="body-text" fill="#0c4a6e">Prevents worker locking</text>
      <text x="15" y="180" class="body-text" fill="#0c4a6e">in multi-instance scaling</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path class="flow-line flow-purple" d="M 675,100 L 705,100" marker-end="url(#arrow-purple)" />

    <!-- Step 4: Kafka Producer -->
    <g transform="translate(710, 0)">
      <rect class="card-purple" width="190" height="200" />
      <circle cx="24" cy="24" r="12" fill="#9333ea" />
      <text x="24" y="28" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="44" y="28" class="card-title" fill="#6b21a8">Kafka Producer</text>
      <line x1="15" y1="45" x2="175" y2="45" stroke="#e9d5ff" />
      <text x="15" y="65" class="code-text" fill="#581c87">KafkaProducerService</text>
      <text x="15" y="85" class="body-text" fill="#581c87">• acks = "all"</text>
      <text x="15" y="105" class="body-text" fill="#581c87">• idempotence = true</text>
      <text x="15" y="125" class="body-text" fill="#581c87">• retries = 3</text>
      <text x="15" y="155" class="code-text" fill="#9333ea">Mark PUBLISHED</text>
      <text x="15" y="175" class="body-text" fill="#6b21a8">Reliable event dispatch</text>
    </g>
  </g>
</svg>
