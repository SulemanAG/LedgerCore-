<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .bg { fill: #f8fafc; }
      .title-main { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .title-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
      .body-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #334155; line-height: 1.35; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10px; filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.04)); }
      .card-red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 10px; }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 10px; }
      .card-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 10px; }
      .card-emerald { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 10px; }
      .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; animation: pulse 2.5s linear infinite; }
      .flow-red { stroke: #dc2626; }
      .flow-amber { stroke: #d97706; }
      .flow-blue { stroke: #0284c7; }
      @keyframes pulse { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      ]]>
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect class="bg" width="1100" height="540" />

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <text class="title-main" x="0" y="20">LedgerCore — Redis Projection, Version Guard &amp; Reconciliation</text>
    <text class="title-sub" x="0" y="40">Atomic Lua Version Guards, Scheduled State Reconciliation, and Self-Healing Backfill / Cleanup</text>
  </g>

  <!-- STAGES -->
  <g transform="translate(40, 90)">
    <!-- Stage 1: Redis Key Model & Storage -->
    <g transform="translate(0, 0)">
      <rect class="card-red" width="310" height="340" />
      <circle cx="28" cy="28" r="14" fill="#dc2626" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="50" y="33" class="card-title" fill="#991b1b">Redis Read-Side Model</text>
      <line x1="20" y1="52" x2="290" y2="52" stroke="#fca5a5" />

      <text x="20" y="75" class="code-text" fill="#7f1d1d">AccountBalanceRedisService</text>
      <text x="20" y="95" class="body-text" fill="#7f1d1d">• Serves balance read queries in &lt;1ms</text>

      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="270" height="95" fill="#ffffff" stroke="#fca5a5" rx="6" />
        <text x="12" y="20" class="code-text" fill="#dc2626" font-weight="700">Key 1: Balance String</text>
        <text x="12" y="38" class="code-text" fill="#7f1d1d">ledgercore:account:{id}:balance</text>
        <text x="12" y="58" class="code-text" fill="#dc2626" font-weight="700">Key 2: Version Guard String</text>
        <text x="12" y="78" class="code-text" fill="#7f1d1d">ledgercore:account:{id}:version</text>
      </g>

      <text x="20" y="230" class="code-text" fill="#dc2626">Eventually Consistent Read Model</text>
      <text x="20" y="255" class="body-text" fill="#991b1b">PostgreSQL remains authoritative single financial source of truth!</text>
    </g>

    <!-- Flow Arrow 1 -> 2 -->
    <path class="flow-line flow-red" d="M 315,170 L 345,170" marker-end="url(#arrow-red)" />

    <!-- Stage 2: Atomic Lua Script Guard -->
    <g transform="translate(350, 0)">
      <rect class="card-amber" width="360" height="340" />
      <circle cx="28" cy="28" r="14" fill="#d97706" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="50" y="33" class="card-title" fill="#b45309">Atomic Lua Version Guard</text>
      <line x1="20" y1="52" x2="340" y2="52" stroke="#fde68a" />

      <text x="20" y="75" class="code-text" fill="#78350f">setBalanceIfVersionGreater.lua</text>
      <text x="20" y="95" class="body-text" fill="#78350f">• Single-threaded atomic evaluation inside Redis</text>

      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="320" height="110" fill="#ffffff" stroke="#fde68a" rx="6" />
        <text x="12" y="20" class="code-text" fill="#be123c" font-weight="700">Case A: Stale Event (incomingVer &lt;= curVer)</text>
        <text x="12" y="38" class="body-text" fill="#881337">→ REJECTED (Returns 0, Redis state unchanged)</text>
        <text x="12" y="60" class="code-text" fill="#16a34a" font-weight="700">Case B: Monotonic Event (incomingVer &gt; curVer)</text>
        <text x="12" y="78" class="body-text" fill="#14532d">→ ACCEPTED (Returns 1, Atomic SET balance &amp; ver)</text>
      </g>

      <text x="20" y="245" class="code-text" fill="#d97706">Zero Balance Regression</text>
      <text x="20" y="265" class="body-text" fill="#78350f">Redelivered or out-of-order events cannot roll back cache balance</text>
    </g>

    <!-- Flow Arrow 2 -> 3 -->
    <path class="flow-line flow-amber" d="M 715,170 L 745,170" marker-end="url(#arrow-amber)" />

    <!-- Stage 3: Reconciliation & Self-Healing -->
    <g transform="translate(750, 0)">
      <rect class="card-blue" width="270" height="340" />
      <circle cx="28" cy="28" r="14" fill="#0284c7" />
      <text x="28" y="33" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="50" y="33" class="card-title" fill="#0369a1">Audit &amp; Self-Healing</text>
      <line x1="20" y1="52" x2="250" y2="52" stroke="#bae6fd" />

      <text x="20" y="75" class="code-text" fill="#0c4a6e">ReconciliationScheduler</text>
      <text x="20" y="95" class="body-text" fill="#0369a1">• Periodic background poller</text>
      <text x="20" y="115" class="body-text" fill="#0369a1">• 4 Audit States: MATCH, MISMATCH, MISSING, ORPHANED</text>

      <g transform="translate(20, 135)">
        <rect x="0" y="0" width="230" height="95" fill="#ffffff" stroke="#bae6fd" rx="6" />
        <text x="10" y="20" class="code-text" fill="#16a34a" font-weight="700">Backfill Service</text>
        <text x="10" y="38" class="body-text" fill="#14532d">Rebuilds keys from PostgreSQL</text>
        <text x="10" y="58" class="code-text" fill="#e11d48" font-weight="700">Safe Orphan Cleanup</text>
        <text x="10" y="78" class="body-text" fill="#881337">Deletes stale keys safely</text>
      </g>

      <text x="20" y="255" class="code-text" fill="#0284c7">Self-Healing Integrity</text>
      <text x="20" y="275" class="body-text" fill="#0c4a6e">Detects &amp; repairs drift without downtime!</text>
    </g>
  </g>

  <!-- SUMMARY FOOTER -->
  <g transform="translate(40, 455)">
    <rect class="card-emerald" width="1020" height="55" />
    <text x="20" y="24" class="card-title" fill="#15803d">Redis Subsystem Guarantees</text>
    <text x="20" y="42" class="body-text" fill="#14532d">Redis projections provide fast read performance, protected by atomic Lua script version guards against out-of-order event regression, and continuously self-healed by scheduled background reconciliation services.</text>
  </g>
</svg>
